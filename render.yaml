# Render blueprint: one free web service that serves both the API and the web page.
services:
  - type: web
    name: blinkx-khofra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BLINKX_CACHE
        value: /tmp/blinkx-cache
